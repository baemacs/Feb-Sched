<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>A Question for You</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <div class="card">
      <h1 class="title">Hi, darling!</h1>

      <p class="lead">Since puno na sched mo sa January, unahan ko na ang February.</p>

      <div class="actions">
        <button id="surpriseBtn" class="btn primary">Pa Sched</button>
      </div>
    </div>
  </main>

  <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="overlay-card">
      <button id="closeOverlay" class="close" aria-label="Close">×</button>
      <h2 id="proposalHeading">Will you be my Valentine?</h2>
      <p id="proposalSub" class="muted">- Mac</p>

      

      <div class="proposal-actions">
        <button id="yesBtn" class="btn yes">Yes 💖</button>
        <button id="noBtn" class="btn no">No, thanks</button>
      </div>
    </div>
  </div>

  <div id="optionsOverlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="overlay-card wide">
      <button id="closeOptionsOverlay" class="close" aria-label="Close">×</button>
      <h2>Choose our date!</h2>
      <div class="options">
        <div class="option">
          <img src="perfume.jpg" alt="Option 1">
          <button class="option-btn">Create A Perfume Date</button>
        </div>
        <div class="option">
          <img src="sip.jpg" alt="Option 2">
          <button class="option-btn">Sip and Paint Date</button>
        </div>
        <div class="option">
          <img src="splat.jpg" alt="Option 3">
          <button class="option-btn">Splat Room Date</button>
        </div>
        <div class="option">
          <img src="superfun.jpg" alt="Option 4">
          <button class="option-btn">Superpark Date</button>
        </div>
      </div>
      <p><i><ems>Or if may other ka pang suggestions: message mo lang yung cute mong darling!</ems></i></p>
    </div>
  </div>

  <div id="finishOverlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="overlay-card">
      <h2>See you, darling! 💕</h2>
      <p class="muted">Your choice has been sent!</p>
    </div>
  </div>

  <div id="confetti-root" class="confetti-root" aria-hidden="true"></div>

  <script src="script.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</body>
</html>
